<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CD-RPS | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background:#0f1117; color:#e0e0e0; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#1a1d27; border:1px solid #2a2d3e; border-radius:16px; width:100%; max-width:440px; }
    .card-header { background:linear-gradient(135deg,#12c2e9,#c471ed); border-radius:16px 16px 0 0; padding:28px 24px; text-align:center; }
    .form-control, .form-select { background:#0f1117; border:1px solid #2a2d3e; color:#e0e0e0; border-radius:8px; }
    .form-control:focus, .form-select:focus { background:#0f1117; color:#e0e0e0; border-color:#12c2e9; box-shadow:0 0 0 2px rgba(18,194,233,0.2); }
    .form-label { color:#a0a0b0; font-size:13px; font-weight:500; }
    .btn-primary { background:linear-gradient(135deg,#12c2e9,#c471ed); border:none; border-radius:8px; font-weight:600; padding:11px; }
    .btn-primary:hover { opacity:.9; background:linear-gradient(135deg,#12c2e9,#c471ed); }
    .btn-outline-secondary { border-color:#2a2d3e; color:#a0a0b0; border-radius:8px; font-size:13px; }
    .nav-tabs { border-bottom:1px solid #2a2d3e; }
    .nav-tabs .nav-link { color:#a0a0b0; border:none; padding:10px 28px; background:transparent; }
    .nav-tabs .nav-link.active { color:#fff; border-bottom:2px solid #12c2e9; background:transparent; }

    /* Success notification banner */
    #successBanner {
      display:none;
      background:#1a2a1a;
      border:1px solid #27ae60;
      color:#2ecc71;
      border-radius:10px;
      padding:14px 18px;
      margin-bottom:18px;
      font-size:14px;
      font-weight:500;
      text-align:center;
      animation: fadeIn 0.3s ease;
    }
    #errorBanner {
      display:none;
      background:#2a1a1a;
      border:1px solid #c0392b;
      color:#e74c3c;
      border-radius:10px;
      padding:12px 16px;
      margin-bottom:16px;
      font-size:13px;
      text-align:center;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
<div class="p-3" style="width:100%;max-width:440px;">
  <div class="card shadow-lg">
    <div class="card-header">
      <div style="font-size:24px;font-weight:800;color:#fff;">CD-RPS</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.85);margin-top:4px;">Chronic Disease Risk Prediction System</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.55);margin-top:3px;">IGNOU BCA Project &nbsp;|&nbsp; Prosun Kumar Das</div>
    </div>

    <div class="card-body p-4">
      <!-- Tabs -->
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
          <a class="nav-link active" id="loginTab" href="#" onclick="showTab('login');return false;">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="registerTab" href="#" onclick="showTab('register');return false;">Register</a>
        </li>
      </ul>

      <!-- Notifications -->
      <div id="successBanner"></div>
      <div id="errorBanner"></div>

      <!-- LOGIN -->
      <div id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter password"
                 onkeydown="if(event.key==='Enter') doLogin()"/>
        </div>
        <button class="btn btn-primary w-100" onclick="doLogin()">Login</button>
      </div>

      <!-- REGISTER -->
      <div id="registerForm" style="display:none;">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Your full name"/>
          </div>
          <div class="col-6">
            <label class="form-label">Age</label>
            <input type="number" id="regAge" class="form-control" placeholder="25" min="1" max="120"/>
          </div>
          <div class="col-6">
            <label class="form-label">Gender</label>
            <select id="regGender" class="form-control">
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="you@example.com"/>
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create a password"/>
          </div>
          <div class="col-12">
            <label class="form-label">Contact Number <span style="color:#555;">(optional)</span></label>
            <input type="text" id="regContact" class="form-control" placeholder="9876543210"/>
          </div>
          <div class="col-12 mt-2">
            <button class="btn btn-primary w-100" onclick="doRegister()">Create Account</button>
          </div>
        </div>
      </div>

    </div>
  </div>
  <div style="text-align:center;font-size:11px;color:#333;margin-top:12px;">
    School of Computer &amp; Information Sciences, IGNOU, New Delhi
  </div>
</div>

<script>
  const API = '';

  function showTab(tab) {
    document.getElementById('loginForm').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('loginTab').classList.toggle('active',    tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    hideBanners();
  }

  function hideBanners() {
    document.getElementById('successBanner').style.display = 'none';
    document.getElementById('errorBanner').style.display   = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successBanner');
    el.innerHTML = '&#10003;&nbsp; ' + msg;
    el.style.display = 'block';
    document.getElementById('errorBanner').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successBanner').style.display = 'none';
  }

  async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Please enter your email and password.'); return; }
    try {
      const res  = await fetch(`${API}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('patient', JSON.stringify(data));
        window.location.href = '/predict.html';
      } else {
        showError(data.message);
      }
    } catch(e) {
      showError('Cannot connect to server. Make sure Flask is running.');
    }
  }

  async function doRegister() {
    const name     = document.getElementById('regName').value.trim();
    const age      = document.getElementById('regAge').value;
    const gender   = document.getElementById('regGender').value;
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const contact  = document.getElementById('regContact').value.trim();

    if (!name || !age || !gender || !email || !password) {
      showError('Please fill in all required fields.'); return;
    }
    try {
      const res  = await fetch(`${API}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, age: parseInt(age), gender, email, password, contact })
      });
      const data = await res.json();
      if (data.success) {
        // ── Green success notification ──
        showSuccess('Account created successfully! You can now login with your email and password.');
        // Pre-fill email in login form and switch tab after 1.5s
        document.getElementById('loginEmail').value = email;
        setTimeout(() => { showTab('login'); }, 1500);
      } else {
        showError(data.message);
      }
    } catch(e) {
      showError('Cannot connect to server. Make sure Flask is running.');
    }
  }
</script>
</body>
</html>
